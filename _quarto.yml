project:
  type: book
  output-dir: docs

book:
  title: "Herramientas computacionales para la ciencia abierta: reproducibilidad, transparencia y apertura"
  author: "Laboratorio de Investigación Social Abierta"
  date: "11/01/2025"
  sidebar:
    style: docked
    search: true
    collapse-level: 2
    pinned: true
    logo: assets/cover.png # Logo que aparece en el panel lateral
  downloads: 
    - pdf
  search: true
  repo-actions: []
  page-navigation: true
  chapters:
    - index.qmd
    - 01-intro.qmd
    - part: 02-diseno-transparente.qmd
      title: "Diseño Transparente"
      chapters:
        - 02a-diseno-transparente.qmd
        - 02b-diseno-transparente.qmd
    - part: 03-datos-abiertos.qmd
      title: "Datos Abiertos"
      chapters:
        - 03a-datos-abiertos.qmd
        - 03b-datos-abiertos.qmd
    - part: 04-analisis-reproducible.qmd
      title: "Análisis Reproducible"
      chapters:
        - 04a-analisis-reproducible.qmd
    - part: 05-publicaciones-libres.qmd
      title: "Publicaciones Libres"
      chapters:
        - 05a-publicaciones-libres.qmd
        - 05b-publicaciones-libres.qmd
        - 05c-publicaciones-libres.qmd
        - 05d-publicaciones-libres.qmd
    - 06-conclusion.qmd
    - 07-references.qmd

bibliography: input\bib\lisacoes.bib
lang: es

format:
  html:
    theme:
      light: cosmo               # Cualquier tema Bootswatch (journal, litera, etc.)
    toc: true                   
    toc-depth: 3
    toc-location: right
    number-sections: true
    code-copy: true              # Boton copiar codigo
    code-tools: true             # Menu con toggles para mostrar/ocultar codigo
    df-print: paged      
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      - includes/justify.html

  pdf:
    pdf-engine: xelatex          # Requiere LaTeX con soporte para fuentes OpenType
    toc: false                   # Generamos TOC/LOF/LOT manualmente en title-pdf.tex
    lof: false
    lot: false
    keep-tex: true
    documentclass: scrbook       # Usa report/book si prefieres otra estructura
    classoption:
      - oneside
    papersize: a4                # Cambia a letter si trabajas con papel tamano carta
    geometry:
      - top=25mm
      - bottom=25mm
      - left=30mm
      - right=20mm
    colorlinks: true
    number-sections: true
    
metadata-files:
  - _metadata.yml               # Ajustes adicionales (palabras clave, portada, etc.)
